<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 问卷系统</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/auth.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"><a class="brand" href="/">问卷系统</a><nav aria-label="主导航"><a href="/register.html">注册账号</a></nav></header>
  <main id="main" class="auth-layout">
    <section class="panel" aria-labelledby="heading">
      <h1 id="heading">登录</h1>
      <p class="muted">使用你的账号进入个人问卷列表。</p>
      <p id="page-notice" class="notice" role="status" hidden></p>
      <form id="auth-form" data-mode="login" action="/login.html" method="post">
        <div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="username-help username-error"><p id="username-help" class="hint">用户名区分大小写。</p><p id="username-error" class="field-error" hidden></p></div>
        <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-help password-error"><p id="password-help" class="hint">密码中的空格会原样保留。</p><p id="password-error" class="field-error" hidden></p></div>
        <p id="form-error" class="notice error" role="alert" tabindex="-1" hidden></p>
        <button id="submit-button" type="submit" disabled>登录</button>
        <p id="form-status" class="hint" role="status" aria-live="polite">正在准备表单…</p>
      </form>
      <p class="form-footer">还没有账号？<a href="/register.html">注册账号</a></p>
      <noscript><p class="notice error">请启用 JavaScript 后登录。</p></noscript>
    </section>
  </main>
</body>
</html>
