<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>题目与题库 · 问卷系统</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/library.css"><script type="module" src="/js/questions.js"></script></head>
<body><header class="site-header"><a class="brand" href="/">问卷系统</a><nav><a href="/surveys.html">我的问卷</a><a href="/login.html" target="_blank" rel="noopener">登录</a></nav></header>
<main class="workspace"><h1>题目与题库</h1><p id="account" class="hint"></p><p id="library-message" role="status" aria-live="polite"></p><div id="library-error" class="notice error" role="alert" hidden></div>
<div class="library-grid"><section class="panel"><h2>题目列表</h2><div class="toolbar"><select id="scope" aria-label="题目范围"><option value="own">我的题目</option><option value="shared">共享给我</option></select><label class="check-label"><input id="archived" type="checkbox">已归档</label><button id="refresh" type="button">刷新</button><button id="new-question" type="button">创建题目</button></div><div id="question-list"></div><button id="next-questions" type="button" hidden>下一页题目</button></section>
<section id="question-detail" class="panel" hidden><h2 id="detail-title"></h2><div id="question-actions" class="toolbar"></div><h3>历史版本</h3><p class="hint">版本可从任意旧版分叉。共享题可选用或另存；统计只包含自己的问卷。</p><div id="versions"></div><button id="next-versions" type="button" hidden>更多版本</button><div id="shares"></div><div id="usage"></div></section></div>
<section id="content-panel" class="panel" hidden><h2 id="content-heading">创建题目</h2><form id="content-form"><fieldset id="content-fields"><div id="content-editor"></div><button type="submit">保存版本</button><button id="cancel-content" type="button" class="secondary">取消编辑</button></fieldset></form></section>
<section class="panel"><h2>个人题库</h2><form id="bank-form" class="toolbar"><label>题库名称<input id="bank-name" required maxlength="100"></label><button type="submit">创建题库</button></form><div id="banks"></div><button id="next-banks" type="button" hidden>下一页题库</button><div id="bank-items"></div></section>
<section id="comparison-panel" class="panel" hidden><h2>版本统计对比</h2><div id="comparisons" class="library-grid"></div></section>
</main></body></html>
