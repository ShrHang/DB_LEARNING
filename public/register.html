<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 · 问卷系统</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/auth.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"><a class="brand" href="/">问卷系统</a><nav aria-label="主导航"><a href="/login.html">登录</a></nav></header>
  <main id="main" class="auth-layout">
    <section class="panel" aria-labelledby="heading">
      <h1 id="heading">注册账号</h1>
      <p class="muted">创建账号后，即可登录使用个人问卷列表。</p>
      <form id="auth-form" data-mode="register" action="/register.html" method="post">
        <div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="username-help username-error"><p id="username-help" class="hint">3–32 个 Unicode 码点；支持中英文文字、数字、下划线和连字符，不含空白，区分大小写。</p><p id="username-error" class="field-error" hidden></p></div>
        <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-help password-error"><p id="password-help" class="hint">8–128 个 Unicode 码点，可含空格。空格会原样保留，无需组合多种字符。</p><p id="password-error" class="field-error" hidden></p></div>
        <p id="form-error" class="notice error" role="alert" tabindex="-1" hidden></p>
        <button id="submit-button" type="submit" disabled>注册</button>
        <p id="form-status" class="hint" role="status" aria-live="polite">正在准备表单…</p>
      </form>
      <div id="register-success" class="notice success" role="status" tabindex="-1" hidden><p>注册成功。请登录后进入个人问卷列表。</p><a class="button" href="/login.html?registered=1">前往登录</a></div>
      <p class="form-footer">已有账号？<a href="/login.html">登录</a></p>
      <noscript><p class="notice error">请启用 JavaScript 后注册。</p></noscript>
    </section>
  </main>
</body>
</html>
